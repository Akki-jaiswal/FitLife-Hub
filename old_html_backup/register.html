<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join FitLife Hub 💪</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <section class="contact" id="register">
        <h2 class="section-title">Create Your Account</h2>
        <div class="container">
            <form action="/register" method="POST" class="contact-form">
                <input type="text" name="username" placeholder="Choose a Username" required>
                <input type="password" name="password" placeholder="Create a Password" required>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <p><a href="/login">Already a member? Login here</a></p>
            <p><a href="{{ url_for('index') }}">Changed your mind? Back to Home</a></p>
        </div>
    </section>
</body>
</html>
